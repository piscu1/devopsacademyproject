parameters:
  - name: terraformAction
    type: string
  - name: environment
    type: string
  - name: imageTag
    type: string

jobs:
- job: TerraformJob
  displayName: 'Terraform Keyvault Provision'
  steps:
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: Bash@3
      displayName: 'Append image tag to tfvars'
      inputs:
        targetType: 'inline'
        script: |
          echo 'container_image_name = "my-node-app:${{ parameters.imageTag }}"' >> infra/terraform.tfvars

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
        backendServiceArm: 'SVC-AzureDevops'
        backendAzureRmResourceGroupName: 'RG-alexandru-pisculungeanu'
        backendAzureRmStorageAccountName: 'storageaccountpiscu'
        backendAzureRmContainerName: 'tf-state'
        backendAzureRmKey: 'piscu-kv.tfstate'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
        commandOptions: '-target=module.key_vault'
        environmentServiceNameAzureRM: 'SVC-AzureDevops'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Apply'
      condition: eq('${{ parameters.terraformAction }}', 'apply')
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
        commandOptions: '-auto-approve -target=module.key_vault'
        environmentServiceNameAzureRM: 'SVC-AzureDevops'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Destroy'
      condition: eq('${{ parameters.terraformAction }}', 'destroy')
      inputs:
        provider: 'azurerm'
        command: 'destroy'
        workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
        commandOptions: '-auto-approve'
        environmentServiceNameAzureRM: 'SVC-AzureDevops'
